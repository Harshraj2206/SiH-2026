version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: landslideguard_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - JWT_SECRET=change_me_to_a_secure_random_key_in_production
      - CORS_ORIGINS=*
      - DATABASE_PATH=data/landslideguard_users.db
      - DATA_DIR=data
    volumes:
      - ./backend/data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8000/api
    container_name: landslideguard_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
