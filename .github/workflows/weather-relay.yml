name: Weather relay

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python backend/scripts/weather_relay.py
        env:
          BACKEND_URL: https://landslideguard-backend.onrender.com
          WEATHER_RELAY_TOKEN: ${{ secrets.WEATHER_RELAY_TOKEN }}
